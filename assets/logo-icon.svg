<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian / Dark Graphite Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151B"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- Liquid Glass Specular Edge (Top-Left Light Source) -->
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Clean Diagonal Glass Surface Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Sophisticated Monochrome Liquid Frost for the "A" -->
    <linearGradient id="liquidA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Pure Electric Accent for the Sine Wave (Subtle, Premium Cyan/Ice-Blue) -->
    <linearGradient id="waveIce" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Soft Shadow for Depth -->
    <filter id="softDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="512" height="512" rx="120" ry="120"/>
    </clipPath>
  </defs>

  <!-- ================= BASE CONTAINER ================= -->
  <g clip-path="url(#cardClip)">
    <!-- Dark Matte Obsidian Base -->
    <rect width="512" height="512" fill="url(#bgDark)"/>

    <!-- Subtle Radial Vignette -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <circle cx="256" cy="256" r="240" fill="url(#centerGlow)"/>

    <!-- Diagonal Glass Surface Sheen -->
    <path d="M 0,0 L 512,0 L 512,160 C 340,180 180,260 0,440 Z" fill="url(#glassSheen)"/>

    <!-- ================= THE MINIMALIST "A" ================= -->
    <g filter="url(#softDepth)">
      <!-- The "A" Legs (Clean, Bold, Geometric) -->
      <path d="M 148,375 L 256,130 L 364,375" 
            fill="none" 
            stroke="url(#liquidA)" 
            stroke-width="24" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Specular Highlight along the top edge of the "A" (Glass Tube Reflection) -->
      <path d="M 150,370 L 256,134 L 362,370" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round"
            opacity="0.6"/>

      <!-- ================= THE SINE WAVE (CROSSBAR) ================= -->
      <!-- Soft ambient glow behind the wave -->
      <path d="M 140,280 C 172,230 224,230 256,280 C 288,330 340,330 372,280" 
            fill="none" 
            stroke="#38BDF8" 
            stroke-width="26" 
            stroke-linecap="round" 
            opacity="0.25" 
            filter="url(#waveGlow)"/>

      <!-- The Core Wave -->
      <path d="M 140,280 C 172,230 224,230 256,280 C 288,330 340,330 372,280" 
            fill="none" 
            stroke="url(#waveIce)" 
            stroke-width="20" 
            stroke-linecap="round"/>

      <!-- Crisp Specular Crest on the Wave -->
      <path d="M 142,278 C 172,228 224,228 256,278 C 288,328 340,328 370,278" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            opacity="0.85"/>
    </g>
  </g>

  <!-- ================= 1PX LIQUID GLASS BEVEL BORDER ================= -->
  <rect width="512" height="512" rx="120" ry="120" 
        fill="none" 
        stroke="url(#glassEdge)" 
        stroke-width="2.5"/>
</svg>
