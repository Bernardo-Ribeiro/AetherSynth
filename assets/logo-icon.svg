<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1B1736"/>
      <stop offset="60%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#05070B"/>
    </radialGradient>

    <linearGradient id="neonCyanPurpleSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="45%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>

    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="110" fill="url(#bgGlow)"/>
  <rect width="100%" height="100%" rx="110" fill="none" stroke="url(#neonCyanPurpleSquare)" stroke-width="3" opacity="0.6"/>

  <!-- Orbital Rings (Holographic Frequency Scope) -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="10 12" opacity="0.35"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#D500F9" stroke-width="1" stroke-dasharray="4 6" opacity="0.25"/>

  <!-- Radial HUD Ticks -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.4">
    <line x1="256" y1="56" x2="256" y2="72"/>
    <line x1="256" y1="440" x2="256" y2="456"/>
    <line x1="56" y1="256" x2="72" y2="256"/>
    <line x1="440" y1="256" x2="456" y2="256"/>
  </g>

  <!-- Central "A" Structure (The Aether & The Synthesizer) -->
  <path d="M 140,370 L 256,120 L 372,370" fill="none" stroke="url(#neonCyanPurpleSquare)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)"/>

  <!-- Sine Wave Holographic Crossbar -->
  <path d="M 160,285 Q 208,225 256,285 T 352,285" fill="none" stroke="#00E5FF" stroke-width="12" stroke-linecap="round" filter="url(#nodeGlow)"/>
  <path d="M 180,315 Q 218,275 256,315 T 332,315" fill="none" stroke="#D500F9" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- Landmark Biometric Nodes (Hand tracking joints) -->
  <circle cx="256" cy="120" r="18" fill="#FFFFFF" stroke="#00E5FF" stroke-width="7" filter="url(#nodeGlow)"/>
  <circle cx="140" cy="370" r="14" fill="#D500F9" stroke="#FFFFFF" stroke-width="5" filter="url(#nodeGlow)"/>
  <circle cx="372" cy="370" r="14" fill="#00E5FF" stroke="#FFFFFF" stroke-width="5" filter="url(#nodeGlow)"/>
  <circle cx="256" cy="285" r="11" fill="#00E5FF" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Internal Ray & Energy Core -->
  <line x1="256" y1="138" x2="256" y2="200" stroke="#00E5FF" stroke-width="3" stroke-dasharray="4 6" opacity="0.8"/>
  <circle cx="256" cy="210" r="8" fill="#00E676" filter="url(#nodeGlow)"/>
</svg>
