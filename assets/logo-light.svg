<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Dark A for Light Background -->
    <linearGradient id="lightA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Deep Blue Wave -->
    <linearGradient id="lightWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="20"/>
  <rect width="100%" height="100%" rx="20" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- ================= THE MINIMAL SYMBOL (Left) ================= -->
  <g transform="translate(50, 20)">
    <!-- The "A" Legs -->
    <path d="M 52,150 L 105,32 L 158,150" 
          fill="none" 
          stroke="url(#lightA)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- The Sine Wave (Crossbar) -->
    <path d="M 46,105 C 64,80 90,80 105,105 C 120,130 146,130 164,105" 
          fill="none" 
          stroke="url(#lightWave)" 
          stroke-width="9.5" 
          stroke-linecap="round"/>
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(260, 78)">
    <!-- Wordmark -->
    <text x="0" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="54" letter-spacing="-0.5">
      <tspan fill="#0F172A">Aether</tspan><tspan fill="#0284C7">Synth</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#64748B" letter-spacing="5">
      GESTURAL SYNTHESIZER &amp; AI TUTOR
    </text>

    <!-- Minimal Badges -->
    <g transform="translate(3, 102)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="40" y="14" font-family="monospace" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="bold">RUST DSP</text>

      <rect x="90" y="0" width="105" height="20" rx="4" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
      <text x="142" y="14" font-family="monospace" font-size="9.5" fill="#0369A1" text-anchor="middle" font-weight="bold">MEDIAPIPE IA</text>

      <rect x="205" y="0" width="95" height="20" rx="4" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <text x="252" y="14" font-family="monospace" font-size="9.5" fill="#15803D" text-anchor="middle" font-weight="bold">REAL-TIME</text>
    </g>
  </g>
</svg>
