<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Liquid Glass Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>

    <linearGradient id="glassPrimaryBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#00E5FF" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7C4DFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D500F9" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="glassSheenBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tubeSpecularPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E0F7FA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Droplet Radial Gradients -->
    <radialGradient id="orbApexPrimary" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#80D8FF"/>
      <stop offset="70%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#004D40"/>
    </radialGradient>

    <radialGradient id="orbMagentaPrimary" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#EA80FC"/>
      <stop offset="75%" stop-color="#D500F9"/>
      <stop offset="100%" stop-color="#4A0072"/>
    </radialGradient>

    <radialGradient id="orbCyanPrimary" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#84FFFF"/>
      <stop offset="75%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Canvas with Subtle 3D Glass Bevel -->
  <rect width="100%" height="100%" fill="#080B12" rx="20"/>
  <rect width="100%" height="100%" rx="20" fill="none" stroke="url(#glassPrimaryBevel)" stroke-width="2" opacity="0.65"/>

  <!-- Top-left Liquid Glass Sheen -->
  <path d="M 0,0 L 500,0 L 260,220 L 0,220 Z" fill="url(#glassSheenBanner)" opacity="0.7"/>

  <!-- ================= SYMBOL (Left) ================= -->
  <g transform="translate(38, 20)">
    <!-- Symbol Glass Backing Orb -->
    <circle cx="90" cy="90" r="78" fill="#141126" opacity="0.5"/>
    <circle cx="90" cy="90" r="78" fill="none" stroke="#7C4DFF" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="90" cy="90" r="84" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>

    <!-- 1. Geometric "A" Outer Glow & Body -->
    <path d="M 45,150 L 90,30 L 135,150" fill="none" stroke="url(#neonCyanPurple)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#neonGlow)"/>
    <path d="M 45,150 L 90,30 L 135,150" fill="none" stroke="url(#neonCyanPurple)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 2. Inner Liquid Beam -->
    <path d="M 45,150 L 90,30 L 135,150" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- 3. Glass Tube Specular Ridge -->
    <path d="M 47,146 L 89,32 L 131,146" fill="none" stroke="url(#tubeSpecularPrimary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

    <!-- ================= SINE WAVE ================= -->
    <path d="M 60,126 Q 75,108 90,126 T 120,126" fill="none" stroke="#D500F9" stroke-width="4.5" stroke-linecap="round" opacity="0.8" filter="url(#subtleGlow)"/>
    <path d="M 52,112 Q 70,88 90,112 T 128,112" fill="none" stroke="#00E5FF" stroke-width="6.5" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <path d="M 53,110 Q 70,87 90,110 T 127,110" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- Internal Vertical Beam -->
    <line x1="90" y1="37" x2="90" y2="68" stroke="#00E5FF" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.8"/>
    <circle cx="90" cy="72" r="4.5" fill="#00E676" filter="url(#subtleGlow)"/>
    <circle cx="89" cy="71" r="1.5" fill="#FFFFFF"/>

    <!-- ================= LIQUID GLASS DROPLET NODES ================= -->
    <!-- Apex Node -->
    <circle cx="90" cy="30" r="10" fill="#00E5FF" opacity="0.3" filter="url(#subtleGlow)"/>
    <circle cx="90" cy="30" r="8.5" fill="url(#orbApexPrimary)"/>
    <ellipse cx="88" cy="27" rx="3" ry="1.8" transform="rotate(-30 88 27)" fill="#FFFFFF" opacity="0.95"/>

    <!-- Left Node -->
    <circle cx="45" cy="150" r="7.5" fill="url(#orbMagentaPrimary)"/>
    <ellipse cx="43.5" cy="147.5" rx="2.5" ry="1.4" transform="rotate(-30 43.5 147.5)" fill="#FFFFFF" opacity="0.9"/>

    <!-- Right Node -->
    <circle cx="135" cy="150" r="7.5" fill="url(#orbCyanPrimary)"/>
    <ellipse cx="133.5" cy="147.5" rx="2.5" ry="1.4" transform="rotate(-30 133.5 147.5)" fill="#FFFFFF" opacity="0.9"/>

    <!-- Wave Center Node -->
    <circle cx="90" cy="112" r="6" fill="url(#orbApexPrimary)"/>
    <ellipse cx="88.5" cy="110" rx="2" ry="1.2" transform="rotate(-30 88.5 110)" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(250, 75)">
    <!-- Wordmark with Glass Shimmer -->
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="2">
      <tspan fill="url(#textGrad)">Aether</tspan>
      <tspan fill="#D500F9" filter="url(#subtleGlow)">Synth</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="4" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#80D8FF" letter-spacing="6" opacity="0.9">
      AI GESTURAL SYNTHESIZER &amp; TUTOR
    </text>

    <!-- Glassmorphic Tech Badges -->
    <g transform="translate(4, 105)">
      <!-- Badge 1: Rust DSP -->
      <rect x="0" y="0" width="94" height="22" rx="6" fill="#101826" stroke="#00E5FF" stroke-width="1.2"/>
      <path d="M 0,0 L 94,0 L 47,11 Z" fill="#FFFFFF" opacity="0.08"/>
      <text x="47" y="15" font-family="monospace" font-size="10.5" fill="#00E5FF" text-anchor="middle" font-weight="bold">RUST DSP</text>

      <!-- Badge 2: MediaPipe IA -->
      <rect x="106" y="0" width="120" height="22" rx="6" fill="#1A1226" stroke="#D500F9" stroke-width="1.2"/>
      <path d="M 106,0 L 226,0 L 166,11 Z" fill="#FFFFFF" opacity="0.08"/>
      <text x="166" y="15" font-family="monospace" font-size="10.5" fill="#D500F9" text-anchor="middle" font-weight="bold">MEDIAPIPE IA</text>

      <!-- Badge 3: Real-Time HUD -->
      <rect x="238" y="0" width="112" height="22" rx="6" fill="#0E1C1A" stroke="#00E676" stroke-width="1.2"/>
      <path d="M 238,0 L 350,0 L 294,11 Z" fill="#FFFFFF" opacity="0.08"/>
      <text x="294" y="15" font-family="monospace" font-size="10.5" fill="#00E676" text-anchor="middle" font-weight="bold">LIQUID HUD</text>
    </g>
  </g>
</svg>
