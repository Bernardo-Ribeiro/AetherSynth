<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="primaryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>

    <!-- 1px Glass Rim Bevel -->
    <linearGradient id="primaryRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Liquid Frost for the "A" -->
    <linearGradient id="primaryA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Ice Wave Gradient -->
    <linearGradient id="primaryWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Clean Canvas with Subtle Glass Border -->
  <rect width="100%" height="100%" fill="url(#primaryBg)" rx="20"/>
  <rect width="100%" height="100%" rx="20" fill="none" stroke="url(#primaryRim)" stroke-width="1.5"/>

  <!-- ================= THE MINIMAL SYMBOL (Left) ================= -->
  <g transform="translate(50, 20)" filter="url(#softDrop)">
    <!-- The "A" Legs -->
    <path d="M 52,150 L 105,32 L 158,150" 
          fill="none" 
          stroke="url(#primaryA)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Specular Highlight on "A" -->
    <path d="M 54,147 L 105,34 L 156,147" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="1.6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.6"/>

    <!-- The Sine Wave (Crossbar) -->
    <path d="M 46,105 C 64,80 90,80 105,105 C 120,130 146,130 164,105" 
          fill="none" 
          stroke="url(#primaryWave)" 
          stroke-width="9.5" 
          stroke-linecap="round"/>

    <!-- Specular Crest on the Wave -->
    <path d="M 48,104 C 64,79 90,79 105,104 C 120,129 146,129 162,104" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="1.8" 
          stroke-linecap="round" 
          opacity="0.85"/>
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(260, 78)">
    <!-- Wordmark -->
    <text x="0" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="54" letter-spacing="-0.5">
      <tspan fill="#FFFFFF">Aether</tspan><tspan fill="#38BDF8">Synth</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="3" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94A3B8" letter-spacing="5">
      GESTURAL SYNTHESIZER &amp; AI TUTOR
    </text>

    <!-- Minimal Badges -->
    <g transform="translate(3, 102)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="40" y="14" font-family="monospace" font-size="9.5" fill="#E2E8F0" text-anchor="middle" font-weight="bold">RUST DSP</text>

      <rect x="90" y="0" width="105" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="142" y="14" font-family="monospace" font-size="9.5" fill="#38BDF8" text-anchor="middle" font-weight="bold">MEDIAPIPE IA</text>

      <rect x="205" y="0" width="95" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="252" y="14" font-family="monospace" font-size="9.5" fill="#A7F3D0" text-anchor="middle" font-weight="bold">REAL-TIME</text>
    </g>
  </g>
</svg>
