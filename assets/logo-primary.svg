<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="840" height="220">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#D500F9"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="100%" height="100%" fill="#0A0E17" rx="16"/>
  
  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#00E5FF" stroke-width="1">
    <line x1="0" y1="55" x2="840" y2="55"/>
    <line x1="0" y1="110" x2="840" y2="110"/>
    <line x1="0" y1="165" x2="840" y2="165"/>
    <line x1="220" y1="0" x2="220" y2="220"/>
  </g>

  <!-- ================= SYMBOL (Left) ================= -->
  <g transform="translate(40, 20)">
    <!-- Outer Holographic Soundwave Rings -->
    <circle cx="90" cy="90" r="74" fill="none" stroke="#7C4DFF" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
    <circle cx="90" cy="90" r="82" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="8 8" opacity="0.3"/>

    <!-- Geometric "A" / Soundwave Pulse -->
    <path d="M 45,150 L 90,30 L 135,150" fill="none" stroke="url(#neonCyanPurple)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

    <!-- Horizontal Wave Crossbar (Oscilloscope Sine Wave) -->
    <path d="M 52,112 Q 70,88 90,112 T 128,112" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <path d="M 60,126 Q 75,108 90,126 T 120,126" fill="none" stroke="#D500F9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Biometric Tracking Nodes (MediaPipe Hand Landmark Aesthetics) -->
    <circle cx="90" cy="30" r="7" fill="#FFFFFF" stroke="#00E5FF" stroke-width="3" filter="url(#subtleGlow)"/>
    <circle cx="45" cy="150" r="5" fill="#D500F9" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="135" cy="150" r="5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="90" cy="112" r="4.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Core Energy Pulse -->
    <circle cx="90" cy="72" r="4" fill="#00E5FF" opacity="0.9" filter="url(#subtleGlow)"/>
    <line x1="90" y1="37" x2="90" y2="68" stroke="#00E5FF" stroke-width="2" stroke-dasharray="2 3" opacity="0.7"/>
  </g>

  <!-- ================= TYPOGRAPHY (Right) ================= -->
  <g transform="translate(250, 75)">
    <!-- Wordmark -->
    <text x="0" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" letter-spacing="2">
      <tspan fill="url(#textGrad)">Aether</tspan>
      <tspan fill="#D500F9" filter="url(#subtleGlow)">Synth</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="4" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#80D8FF" letter-spacing="6" opacity="0.9">
      AI GESTURAL SYNTHESIZER &amp; TUTOR
    </text>

    <!-- Tech Specs Mini Tags -->
    <g transform="translate(4, 105)">
      <rect x="0" y="0" width="90" height="20" rx="4" fill="#141E2E" stroke="#00E5FF" stroke-width="1"/>
      <text x="45" y="14" font-family="monospace" font-size="10" fill="#00E5FF" text-anchor="middle" font-weight="bold">RUST DSP</text>

      <rect x="100" y="0" width="115" height="20" rx="4" fill="#1E1428" stroke="#D500F9" stroke-width="1"/>
      <text x="157" y="14" font-family="monospace" font-size="10" fill="#D500F9" text-anchor="middle" font-weight="bold">MEDIAPIPE IA</text>

      <rect x="225" y="0" width="105" height="20" rx="4" fill="#142422" stroke="#00E676" stroke-width="1"/>
      <text x="277" y="14" font-family="monospace" font-size="10" fill="#00E676" text-anchor="middle" font-weight="bold">REAL-TIME HUD</text>
    </g>
  </g>
</svg>
